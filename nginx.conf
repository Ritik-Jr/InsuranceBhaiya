# Redirect all HTTP traffic (both www and non-www) to HTTPS non-www
server {
    listen 80;
    server_name insurancebhaiya.com www.insurancebhaiya.com;
    return 301 https://insurancebhaiya.com$request_uri;
}

# Redirect HTTPS www to non-www
server {
    listen 443 ssl;
    server_name www.insurancebhaiya.com;
    return 301 https://insurancebhaiya.com$request_uri;
}

server {
    listen 443 ssl;
    listen 8080;
    server_name insurancebhaiya.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
}
